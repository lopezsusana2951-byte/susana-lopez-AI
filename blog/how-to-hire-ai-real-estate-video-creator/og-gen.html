<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0f; font-family: Georgia, 'Times New Roman', serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 80% 50%, rgba(201,169,106,0.09) 0%, transparent 65%), radial-gradient(ellipse 50% 80% at 10% 50%, rgba(201,169,106,0.05) 0%, transparent 55%), #0a0a0f; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(201,169,106,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(201,169,106,0.035) 1px, transparent 1px); background-size: 60px 60px; }
  .rule-top, .rule-bottom { position: absolute; left: 56px; right: 56px; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,169,106,0.5), rgba(201,169,106,0.85), rgba(201,169,106,0.5), transparent); }
  .rule-top { top: 52px; } .rule-bottom { bottom: 52px; }
  .accent-bar { position: absolute; left: 56px; top: 52px; bottom: 52px; width: 2px; background: linear-gradient(180deg, transparent, #c9a96a 20%, #c9a96a 80%, transparent); }
  .inner { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 90px 0 88px; gap: 48px; }
  .left { flex: 1; display: flex; flex-direction: column; }
  .title { font-size: 50px; line-height: 1.12; color: #f0ece4; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 28px; }
  .title em { font-style: italic; color: #c9a96a; }
  .divider { width: 48px; height: 1px; background: rgba(201,169,106,0.5); margin-bottom: 22px; }
  .byline { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 300; color: rgba(240,236,228,0.45); letter-spacing: 0.18em; text-transform: uppercase; }
  .right { width: 220px; height: 220px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border: 1px solid rgba(201,169,106,0.18); border-radius: 50%; }
  .ring-1 { inset: 0; } .ring-2 { inset: 18px; border-color: rgba(201,169,106,0.11); } .ring-3 { inset: 36px; border-color: rgba(201,169,106,0.07); }
  .monogram { font-size: 80px; color: #c9a96a; font-weight: 400; letter-spacing: 0.05em; opacity: 0.88; position: relative; z-index: 2; }
  .corner-br { position: absolute; bottom: 68px; right: 64px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; letter-spacing: 0.28em; color: rgba(201,169,106,0.4); text-transform: uppercase; text-align: right; }
  .tag { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; letter-spacing: 0.2em; color: #c9a96a; text-transform: uppercase; border: 1px solid rgba(201,169,106,0.35); padding: 5px 13px; margin-bottom: 20px; }
</style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="rule-top"></div><div class="rule-bottom"></div><div class="accent-bar"></div>
  <div class="corner-br">SUSANALOPEZ-AI.NETLIFY.APP</div>
  <div class="inner">
    <div class="left">
      <div class="tag">Buyer's Guide · 2026</div>
      <div class="title">How to <em>Hire</em> an<br>AI Real Estate<br><em>Video Creator</em><br>in 2026</div>
      <div class="divider"></div>
      <div class="byline">Susana Lopez &nbsp;·&nbsp; AI Video Creator</div>
    </div>
    <div class="right">
      <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
      <div class="monogram">SL</div>
    </div>
  </div>
</body>
</html>
